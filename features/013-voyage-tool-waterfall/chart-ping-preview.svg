<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380" style="border-radius:10px;">
  <defs>
    <style>
      .mono { font-family: 'SF Mono','Fira Code','Cascadia Code',monospace; }
    </style>

    <!-- glow filter for active pings -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- dot pattern for chart grid -->
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="0.8" fill="#1e3d5c" opacity="0.6"/>
    </pattern>

    <!-- clip to viewport -->
    <clipPath id="viewport"><rect width="480" height="380"/></clipPath>
  </defs>

  <!-- ── Background ── -->
  <rect width="480" height="380" fill="#0b1929"/>
  <rect width="480" height="380" fill="url(#grid)"/>

  <!-- ── Depth contour lines (nautical chart, organic curves) ── -->
  <g clip-path="url(#viewport)" fill="none" stroke="#1e3d5c" stroke-width="0.7" opacity="0.55">
    <!-- outermost -->
    <path d="M 55,35 C 170,0 340,0 435,80 C 500,150 495,280 420,340 C 340,400 175,405 85,345 C 5,290 -10,155 55,35 Z"/>
    <!-- middle -->
    <path d="M 115,78 C 210,48 328,52 398,118 C 458,176 452,283 390,323 C 318,364 192,362 125,300 C 63,243 62,138 115,78 Z"/>
    <!-- inner -->
    <path d="M 158,118 C 222,96 304,108 352,162 C 398,212 390,280 340,312 C 282,344 200,338 155,280 C 110,226 108,152 158,118 Z"/>
    <!-- innermost (shallow shelf) -->
    <path d="M 195,152 C 232,136 292,148 324,184 C 354,220 346,272 308,292 C 268,312 212,308 185,272 C 155,236 158,172 195,152 Z"/>
  </g>

  <!-- ── Compass rose (top-right corner) ── -->
  <g transform="translate(446,34)" opacity="0.35" fill="#4a8aaa" stroke="none">
    <polygon points="0,-12 2.5,-4 0,-6 -2.5,-4" transform="rotate(0)"/>
    <polygon points="0,-12 2.5,-4 0,-6 -2.5,-4" transform="rotate(90)"/>
    <polygon points="0,-12 2.5,-4 0,-6 -2.5,-4" transform="rotate(180)"/>
    <polygon points="0,-12 2.5,-4 0,-6 -2.5,-4" transform="rotate(270)"/>
    <circle r="2.5" fill="#1e3d5c"/>
    <circle r="1.2" fill="#4a8aaa"/>
  </g>
  <text x="446" y="58" text-anchor="middle" font-size="7" fill="#4a8aaa" opacity="0.4" class="mono">N</text>

  <!-- ── Scale bar (bottom-left) ── -->
  <g transform="translate(22,356)" opacity="0.45">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#4a8aaa" stroke-width="1"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#4a8aaa" stroke-width="1"/>
    <line x1="20" y1="-3" x2="20" y2="3" stroke="#4a8aaa" stroke-width="0.7"/>
    <line x1="40" y1="-3" x2="40" y2="3" stroke="#4a8aaa" stroke-width="0.7"/>
    <line x1="60" y1="-4" x2="60" y2="4" stroke="#4a8aaa" stroke-width="1"/>
    <text x="0"  y="12" text-anchor="middle" font-size="7" fill="#4a8aaa" class="mono">0</text>
    <text x="20" y="12" text-anchor="middle" font-size="7" fill="#4a8aaa" class="mono">5s</text>
    <text x="40" y="12" text-anchor="middle" font-size="7" fill="#4a8aaa" class="mono">10s</text>
    <text x="60" y="12" text-anchor="middle" font-size="7" fill="#4a8aaa" class="mono">15s</text>
  </g>

  <!-- ════════════════════════════════════════════
       PING 1: read_file — running ~12s
       position: cx=188 cy=192
       4 rings, staggered 1s, 4s cycle, r → 90
       ════════════════════════════════════════════ -->
  <g id="ping-readfile" clip-path="url(#viewport)">
    <!-- ring A -->
    <circle cx="188" cy="192" r="4" fill="none" stroke="#38d4b2" stroke-width="1.4">
      <animate attributeName="r"             from="4" to="90" dur="4s" begin="0s"  repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" from="0.72" to="0" dur="4s" begin="0s"  repeatCount="indefinite"/>
      <animate attributeName="stroke-width"   from="1.4" to="0.3" dur="4s" begin="0s"  repeatCount="indefinite"/>
    </circle>
    <!-- ring B  -->
    <circle cx="188" cy="192" r="4" fill="none" stroke="#38d4b2" stroke-width="1.4">
      <animate attributeName="r"             from="4" to="90" dur="4s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" from="0.72" to="0" dur="4s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width"   from="1.4" to="0.3" dur="4s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <!-- ring C  -->
    <circle cx="188" cy="192" r="4" fill="none" stroke="#38d4b2" stroke-width="1.4">
      <animate attributeName="r"             from="4" to="90" dur="4s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" from="0.72" to="0" dur="4s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width"   from="1.4" to="0.3" dur="4s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <!-- ring D  -->
    <circle cx="188" cy="192" r="4" fill="none" stroke="#38d4b2" stroke-width="1.4">
      <animate attributeName="r"             from="4" to="90" dur="4s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" from="0.72" to="0" dur="4s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width"   from="1.4" to="0.3" dur="4s" begin="-3s" repeatCount="indefinite"/>
    </circle>
    <!-- center dot (pulsing) -->
    <circle cx="188" cy="192" r="3" fill="#38d4b2" filter="url(#glow)">
      <animate attributeName="r"            values="3;5;3"     dur="2s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="1;0.65;1"  dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- contact cross -->
    <line x1="183" y1="192" x2="193" y2="192" stroke="#38d4b2" stroke-width="0.8" opacity="0.5"/>
    <line x1="188" y1="187" x2="188" y2="197" stroke="#38d4b2" stroke-width="0.8" opacity="0.5"/>
    <!-- label -->
    <text x="188" y="207" text-anchor="middle" font-size="9.5" fill="#5de8c8" class="mono" filter="url(#glow-sm)">read_file</text>
    <text x="188" y="218" text-anchor="middle" font-size="8" fill="#3a8a7a" class="mono">voyageTimeline.ts</text>
  </g>

  <!-- ════════════════════════════════════════════
       PING 2: web_search — running ~4s, new
       position: cx=335 cy=128
       2 rings, 3s cycle, r → 58
       ════════════════════════════════════════════ -->
  <g id="ping-websearch" clip-path="url(#viewport)">
    <!-- ring A -->
    <circle cx="335" cy="128" r="4" fill="none" stroke="#38d4b2" stroke-width="1.2">
      <animate attributeName="r"             from="4" to="58" dur="3s" begin="0s"  repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" from="0.65" to="0" dur="3s" begin="0s"  repeatCount="indefinite"/>
      <animate attributeName="stroke-width"   from="1.2" to="0.3" dur="3s" begin="0s"  repeatCount="indefinite"/>
    </circle>
    <!-- ring B -->
    <circle cx="335" cy="128" r="4" fill="none" stroke="#38d4b2" stroke-width="1.2">
      <animate attributeName="r"             from="4" to="58" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" from="0.65" to="0" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width"   from="1.2" to="0.3" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- center dot -->
    <circle cx="335" cy="128" r="3" fill="#38d4b2" filter="url(#glow)">
      <animate attributeName="r"            values="3;4.5;3"   dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="1;0.6;1"   dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <line x1="330" y1="128" x2="340" y2="128" stroke="#38d4b2" stroke-width="0.8" opacity="0.5"/>
    <line x1="335" y1="123" x2="335" y2="133" stroke="#38d4b2" stroke-width="0.8" opacity="0.5"/>
    <!-- label -->
    <text x="335" y="143" text-anchor="middle" font-size="9.5" fill="#5de8c8" class="mono" filter="url(#glow-sm)">web_search</text>
    <text x="335" y="154" text-anchor="middle" font-size="8" fill="#3a8a7a" class="mono">"sailing weather"</text>
  </g>

  <!-- ════════════════════════════════════════════
       PING 3: bash — completed
       position: cx=118 cy=298
       checkmark, 1 last ring fading (fill=freeze)
       ════════════════════════════════════════════ -->
  <g id="ping-bash" clip-path="url(#viewport)">
    <!-- last ring, fires once, freezes -->
    <circle cx="118" cy="298" r="4" fill="none" stroke="#38d4b2" stroke-width="1">
      <animate attributeName="r"             from="4"  to="70"  dur="2.5s" begin="0.3s" fill="freeze"/>
      <animate attributeName="stroke-opacity" from="0.5" to="0"  dur="2.5s" begin="0.3s" fill="freeze"/>
    </circle>
    <!-- center becomes ✓ (dimmed) -->
    <circle cx="118" cy="298" r="9" fill="none" stroke="#2a7a62" stroke-width="1" opacity="0.5"/>
    <!-- checkmark path -->
    <path d="M 113,298 L 117,303 L 124,293" fill="none" stroke="#4ecb9a" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" from="0 20" to="20 0" dur="0.4s" begin="0.1s" fill="freeze"/>
    </path>
    <!-- label (dimmed / completed) -->
    <text x="118" y="316" text-anchor="middle" font-size="9.5" fill="#2a7a62" class="mono">bash</text>
    <text x="118" y="327" text-anchor="middle" font-size="8" fill="#1e5548" class="mono">npm run test</text>
  </g>

  <!-- ════════════════════════════════════════════
       PING 4: list_dir — instant (<2s), fading
       position: cx=392 cy=272
       single small ring, animates once
       ════════════════════════════════════════════ -->
  <g id="ping-listdir" clip-path="url(#viewport)">
    <circle cx="392" cy="272" r="4" fill="none" stroke="#38d4b2" stroke-width="0.9">
      <animate attributeName="r"             from="4"  to="32"  dur="1.5s" begin="0s" fill="freeze"/>
      <animate attributeName="stroke-opacity" from="0.45" to="0"  dur="1.5s" begin="0s" fill="freeze"/>
    </circle>
    <!-- tiny dot fading -->
    <circle cx="392" cy="272" r="2" fill="#38d4b2">
      <animate attributeName="fill-opacity" from="0.6" to="0" dur="1.8s" begin="0s" fill="freeze"/>
      <animate attributeName="r"            from="2"   to="0" dur="1.8s" begin="0s" fill="freeze"/>
    </circle>
    <text x="392" y="286" text-anchor="middle" font-size="8.5" fill="#244a5a" class="mono">
      list_dir
      <animate attributeName="opacity" from="0.5" to="0" dur="2s" begin="0.5s" fill="freeze"/>
    </text>
  </g>

  <!-- ── Frame / vignette overlay ── -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#0b1929" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="480" height="380" fill="url(#vignette)" style="pointer-events:none;"/>

  <!-- ── Header strip ── -->
  <rect width="480" height="28" fill="#0d1e30" opacity="0.85"/>
  <text x="16" y="18" font-size="10" fill="#4a8aaa" class="mono" opacity="0.8">海图标注脉冲  ·  CHART PING  ·  方案C</text>
  <circle cx="455" cy="14" r="4" fill="#38d4b2" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="444" y="18" font-size="8" fill="#38d4b2" class="mono" opacity="0.6">LIVE</text>
</svg>
