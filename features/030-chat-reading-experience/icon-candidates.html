<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8" />

<title>缓存图标候选</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#f8fafc;color:#202936;font:14px/1.6 "Segoe UI","Microsoft YaHei UI",sans-serif}h1{font-size:20px;margin:0 0 4px}p{color:#646e7d;margin:0 0 24px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.option{border:1px solid #d6dce5;border-radius:12px;background:white;padding:20px}.option:nth-child(2){border-color:#829bce}.title{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:16px;font-weight:600}.note{font-size:13px;color:#646e7d;min-height:42px;margin-bottom:20px}.sample{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #e4e8ef;color:#646e7d;font-size:13px;white-space:nowrap}.sample span{display:flex;align-items:center;gap:4px}svg{flex:none;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.title svg{width:24px;height:24px}.legend{margin-top:20px;font-size:12px;color:#646e7d} .recommended{font-size:12px;font-weight:400;color:#45659e}
</style>
<h1>缓存命中率：三个图标方向</h1>
<p>下方用量栏按实际 16px 图标展示；数字均为示例。</p>
<div class="options">
<div class="option"><div class="title"><svg viewBox="0 0 24 24"><path d="M3 4h18v5H3zM5 9v11h14V9M9 13h6"/></svg>A · 收纳盒</div><div class="note">接近参考图，表达已存储、可复用的内容。</div><div class="sample"><span>↓ 7.46k</span><span><svg viewBox="0 0 24 24"><path d="M3 4h18v5H3zM5 9v11h14V9M9 13h6"/></svg>96%</span><span>↑ 1.33k</span></div></div>
<div class="option"><div class="title"><svg viewBox="0 0 24 24"><path d="M20 7V3m0 4h-4M20 7a9 9 0 1 0 1 9"/></svg>B · 循环箭头 <span class="recommended">已选</span></div><div class="note">强调复用，但也容易被理解为刷新或重试。</div><div class="sample"><span>↓ 7.46k</span><span><svg viewBox="0 0 24 24"><path d="M20 7V3m0 4h-4M20 7a9 9 0 1 0 1 9"/></svg>96%</span><span>↑ 1.33k</span></div></div>
<div class="option"><div class="title"><svg viewBox="0 0 24 24"><path d="m12 3 10 5-10 5L2 8l10-5Zm-10 9 10 5 10-5M2 16l10 5 10-5"/></svg>C · 叠层</div><div class="note">表达缓存层，视觉简洁，含义稍偏技术。</div><div class="sample"><span>↓ 7.46k</span><span><svg viewBox="0 0 24 24"><path d="m12 3 10 5-10 5L2 8l10-5Zm-10 9 10 5 10-5M2 16l10 5 10-5"/></svg>96%</span><span>↑ 1.33k</span></div></div>
</div>
<div class="legend">已选择 B，保持静态灰色；悬停提示“缓存命中率”，详细信息中显示缓存 token 数量。</div>
</html>
