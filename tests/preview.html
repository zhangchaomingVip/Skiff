<!doctype html>
<html lang="zh-CN">
	<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Skiff · 测试预览</title></head>
	<body>
		<div id="root"></div>
		<script type="module">
			import { installMockPi } from "./mockPi.mjs";
			const { preparePreview } = await import("./uiFixture.mjs");
			const fixture = preparePreview(window);
			await new Promise((resolve, reject) => {
				const script = document.createElement("script");
				script.src = "/theme-init.js";
				script.onload = resolve; script.onerror = reject;
				document.head.append(script);
			});
			if (document.documentElement.dataset.previewStatic) await import("./preview.css");
			window.skiffPreview = installMockPi(window, localStorage, fixture);
			await import("/src/main.tsx");
			const environment = document.createElement("meta");
			environment.name = "skiff-preview-environment";
			environment.content = JSON.stringify({ userAgent: navigator.userAgent, devicePixelRatio, viewport: { width: innerWidth, height: innerHeight }, visualViewportScale: visualViewport?.scale, language: navigator.language, platform: navigator.platform });
			document.head.append(environment);
		</script>
	</body>
</html>
